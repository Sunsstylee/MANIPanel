{% extends "base.html" %}

{% block title %}{{ t('nav_title_actions') }}{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/pages/actions.css') }}">
{% endblock %}

{% block content %}
<div class="actions-wrapper">
    <div class="actions-card glass-panel">
        
        <!-- Поле ввода SteamID -->
        <div class="input-group-row">
            <label for="steamIdInput" class="steam-label">{{ t('label_steam_id') }}</label>
            <input 
                type="text" 
                id="steamIdInput" 
                class="steam-input" 
                placeholder="{{ t('placeholder_steam_id') }}" 
                value="{{ last_steam_id }}"
                autocomplete="off"
            >
        </div>

        <!-- Кнопки действий -->
        <div class="actions-buttons-stack">
            <button id="btnRequestPin" class="action-btn btn-green" type="button">
                {{ t('btn_request_pin') }}
            </button>
            
            <button class="action-btn btn-cyan" type="button">
                {{ t('btn_check_offer_swap') }}
            </button>
            
            <button class="action-btn btn-cyan" type="button">
                {{ t('btn_check_mafile_autologin') }}
            </button>
            
            <button class="action-btn btn-dark" type="button">
                {{ t('btn_check_mafile_logs') }}
            </button>
            
            <button class="action-btn btn-dark" type="button">
                {{ t('btn_check_authorizations') }}
            </button>
        </div>

    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const steamInput = document.getElementById('steamIdInput');
    const btnRequestPin = document.getElementById('btnRequestPin');

    // Запросить закрепление
    btnRequestPin.addEventListener('click', async () => {
        const steamId = steamInput.value.trim();
        if (!steamId) {
            alert('{{ t("err_enter_steamid") }}');
            return;
        }

        btnRequestPin.disabled = true;

        try {
            const res = await fetch('/api/request_pin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ steam_id: steamId })
            });
            const data = await res.json();

            if (data.success) {
                alert(data.message);
            } else {
                alert(data.message);
            }
        } catch (err) {
            alert('{{ t("err_server_conn") }}');
        } finally {
            btnRequestPin.disabled = false;
        }
    });
});
</script>
{% endblock %}
