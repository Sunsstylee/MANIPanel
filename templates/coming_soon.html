{% extends "base.html" %}

{% block title %}{{ page_name }} | {{ t('dashboard_title') }}{% endblock %}

{% block content %}
<div class="coming-soon-wrapper">
    <div class="glow-blob glow-blob-1"></div>
    <div class="glow-blob glow-blob-2"></div>

    <div class="coming-soon-card glass-panel">
        <div class="code-icon-badge">
            <span class="code-icon">&lt;/&gt;</span>
        </div>
        
        <h2 class="coming-soon-title">{{ page_name }}</h2>
        <p class="coming-soon-subtitle">{{ t('coming_soon_desc') }}</p>

        <a href="{{ url_for('auth.dashboard') }}" class="btn-neon btn-back">
            {{ t('btn_back_home') }}
        </a>
    </div>
</div>
{% endblock %}
