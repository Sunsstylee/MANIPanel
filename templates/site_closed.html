<!DOCTYPE html>
<html lang="{{ session.get('lang', 'ru') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MANIPanel — {{ t('site_closed_badge') }}</title>
    <!-- Базовые переменные и стили -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/variables.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/stylee.css') }}">
    <!-- Отдельный CSS текущей страницы -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/site_closed.css') }}">
</head>
<body>

    <div class="maintenance-wrapper">
        <!-- Неоновые фоновые пятна -->
        <div class="glow-blob glow-blob-1"></div>
        <div class="glow-blob glow-blob-2"></div>

        <div class="maintenance-card glass-panel">
            <!-- Переключатель языка -->
            <div class="maintenance-lang-switcher">
                <div class="lang-switcher">
                    <a href="/set_lang/ru" class="lang-btn {% if session.get('lang', 'ru') == 'ru' %}active{% endif %}">RU</a>
                    <a href="/set_lang/en" class="lang-btn {% if session.get('lang') == 'en' %}active{% endif %}">EN</a>
                </div>
            </div>

            <!-- Неоновый значок гаечного ключа -->
            <div class="maintenance-icon-badge">
                <svg viewBox="0 0 24 24" class="maintenance-svg">
                    <path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.6C.5 7 1 10 3 12c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.4-.4.4-1.1 0-1.4z"/>
                </svg>
            </div>

            <!-- Бейдж статуса -->
            <div class="maintenance-badge">
                <span class="status-pulse yellow-pulse"></span>
                <span>{{ t('site_closed_badge') }}</span>
            </div>

            <h1 class="maintenance-title">{{ t('site_closed_title') }}</h1>
            <p class="maintenance-subtitle">{{ t('site_closed_desc') }}</p>

            <!-- Анимированный ползунок прогресса -->
            <div class="maintenance-progress">
                <div class="progress-bar-inner"></div>
            </div>

            <!-- Кнопка перехода на страницу авторизации -->
            <div class="maintenance-footer">
                <a href="{{ url_for('auth.login') }}" class="btn-neon btn-login-try">
                    {{ t('btn_back_login') }}
                </a>
            </div>
        </div>
    </div>

</body>
</html>
