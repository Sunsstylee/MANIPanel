{% extends "base.html" %}

{% block title %}{{ t('login_title') }}{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="glow-blob glow-blob-1"></div>
    <div class="glow-blob glow-blob-2"></div>

    <div class="login-card glass-panel">
        <!-- Квадратик переключения языков -->
        <div class="lang-switcher login-lang-switcher">
            <a href="{{ url_for('auth.login', lang='ru') }}" class="lang-btn {% if session.get('lang', 'ru') == 'ru' %}active{% endif %}">RU</a>
            <a href="{{ url_for('auth.login', lang='en') }}" class="lang-btn {% if session.get('lang') == 'en' %}active{% endif %}">EN</a>
        </div>

        <!-- Иконка замочка по центру -->
        <div class="brand-badge">
            <svg viewBox="0 0 24 24">
                <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
            </svg>
        </div>
        
        <h2>{{ t('login_header') }}</h2>
        <p class="login-subtitle">{{ t('login_subtitle') }}</p>

        <div id="errorContainer">
            {% if error_key %}
                <div class="error-msg">
                    {{ t(error_key) }}
                </div>
            {% endif %}
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}" id="loginForm" data-error-empty="{{ t('error_empty') }}" novalidate>
            <div class="input-group">
                <input type="text" name="username" id="usernameInput" placeholder="{{ t('username_placeholder') }}" value="{{ username if username else '' }}">
            </div>
            <div class="input-group">
                <input type="password" name="password" id="passwordInput" placeholder="{{ t('password_placeholder') }}">
            </div>
            <button type="submit" class="btn-neon">{{ t('login_btn') }}</button>
        </form>
    </div>
</div>

<script src="{{ url_for('static', filename='js/login.js') }}"></script>
{% endblock %}
